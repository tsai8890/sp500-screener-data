name: Update fundamentals

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-update            # shared with prices.yml so the two never push at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m backend.update fundamentals
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Fundamentals $(date -u +'%F %H:%M UTC')"
          git pull --rebase -X theirs origin main
          git push
