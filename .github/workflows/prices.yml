name: Update prices

on:
  schedule:
    # Every 10 minutes, 13:00-21:59 UTC on weekdays. That covers US market hours
    # (9:30-16:00 New York) in both daylight and standard time; the script itself
    # skips runs outside the session. GitHub may start scheduled runs late.
    - cron: "*/10 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch prices even if the market is closed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m backend.update prices ${{ inputs.force && '--force' || '' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Prices $(date -u +'%F %H:%M UTC')"
          git pull --rebase -X theirs origin main
          git push
