name: Update S&P 500 data

on:
  schedule:
    - cron: "15 22 * * 1-5"   # 22:15 UTC weekdays = after the US market close
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade yfinance pandas lxml requests
      - run: python fetch_sp500.py
      - name: Commit data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sp500.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update S&P 500 data $(date -u +%F)"
          git push
