name: Update S&P 500 data

on:
  schedule:
    - cron: "17 */3 * * *"    # every 3 hours (00:17, 03:17, ... UTC)
  workflow_dispatch: {}        # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --upgrade -r backend/requirements.txt
      - run: python backend/fetch_sp500.py
      - name: Commit data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sp500.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update S&P 500 data $(date -u +'%F %H:%M UTC')"
          git pull --rebase --autostash origin main
          git push
